name: Submit a measurement
description: Real memory use from llama.cpp, vLLM, ComfyUI or another engine, to compare with ModelVRAM's estimates.
title: "[measurement] <model> <quant> on <GPU>"
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for measuring. Each submission is checked by hand before it is added to a ModelVRAM accuracy or calibration table.
        Paste the log lines as printed (no screenshots), including units, so the measurements can be compared with the prediction.
        Please remove anything private (paths, host names, tokens) from the log before posting.
  - type: input
    id: model
    attributes:
      label: Model
      description: Hugging Face repo or exact model name, e.g. Qwen/Qwen3.6-35B-A3B
      placeholder: Qwen/Qwen3.6-35B-A3B
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File(s) / quant or dtype
      description: GGUF file name or repo:quant, or the checkpoint and dtype for vLLM (e.g. BF16, FP8). For image/video, include component filenames and dtypes (e.g. diffusion model, text encoder, VAE).
      placeholder: unsloth/Qwen3.6-35B-A3B-GGUF, Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine and version
      description: llama.cpp build number or commit (llama-server --version), vLLM version, Ollama version, ComfyUI version, ...
      placeholder: llama.cpp b6789 (a1b2c3d)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: GPU / device
      description: Card(s) or machine and memory; driver or macOS version if you have it
      placeholder: RTX 4090 24 GB, driver 580.xx
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: LLM context (-c / --max-model-len)
      description: For LLMs, give the context length in tokens. For image/video or other workloads without this setting, enter N/A.
      placeholder: "32768"
    validations:
      required: true
  - type: input
    id: slots
    attributes:
      label: LLM parallel slots (-np / --max-num-seqs)
      description: For LLMs, give the value the server used; llama-server prints it at start-up (n_slots / n_seq_max). For image/video or other workloads without this setting, enter N/A.
      placeholder: "1"
    validations:
      required: true
  - type: dropdown
    id: kv
    attributes:
      label: LLM KV cache type
      description: For LLMs, select the cache type used. For image/video or other workloads without a KV cache, select Not applicable.
      options:
        - f16 (default)
        - bf16
        - q8_0
        - q4_0
        - fp8 (vLLM)
        - other (say which below)
        - Not applicable (image/video or no KV cache)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: |
        llama.cpp: the "KV buffer size", "model buffer size" (CPU and GPU), "compute buffer size" lines, plus nvidia-smi (or Activity Monitor) memory with the model loaded.
        vLLM: the "Model loading took", "Available KV cache memory" and "GPU KV cache size" lines.
        ComfyUI or other image/video workflows: model-loading log lines and/or nvidia-smi memory readings. Include component filenames/dtypes, resolution, batch size and video frame count where relevant.
        For image/video, say whether each reading is model-loaded memory or a generation peak, and describe any CPU offload.
      render: text
      placeholder: |
        llama_kv_cache:      CUDA0 KV buffer size =   640.00 MiB
        load_tensors:        CUDA0 model buffer size = 19234.56 MiB
    validations:
      required: true
  - type: input
    id: speed
    attributes:
      label: Tokens per second (optional)
      description: Generation speed for one request, and the prompt length it was measured at
      placeholder: 142 tok/s at 1,000 prompt tokens
  - type: input
    id: source
    attributes:
      label: Source link (optional)
      description: If the numbers come from a public post, issue or benchmark, link it
      placeholder: https://github.com/ggml-org/llama.cpp/discussions/...
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: Flags you passed (-fa, -ub, --n-cpu-moe, -ot ...), other programs on the GPU, anything unusual

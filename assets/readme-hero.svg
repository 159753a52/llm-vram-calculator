<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">ModelVRAM: know what fits before you download</title><desc id="desc">Illustrated Llama 3.1 8B Q4_K_M calculation. With 8192 tokens, one request and FP16 KV cache, estimated memory is 6.58 GiB. This is a calculated estimate, not a hardware benchmark.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#102137"/></linearGradient><linearGradient id="accent"><stop stop-color="#50EDC8"/><stop offset="1" stop-color="#61ABFF"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#76A3C9" stroke-opacity=".08"/></pattern></defs><rect x="0" y="0" width="1600" height="840" rx="28" fill="url(#bg)" /><rect x="0" y="0" width="1600" height="840" rx="28" fill="url(#grid)" /><rect x="64" y="58" width="48" height="48" rx="12" fill="url(#accent)" /><text x="76" y="90" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#08202B" >M</text><text x="130" y="93" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#F3F8FF" >ModelVRAM</text><text x="66" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#5BE0C5" letter-spacing="3">OPEN-SOURCE  /  LOCAL AI</text><text x="64" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" >Know what fits.</text><text x="64" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="55" font-weight="700" fill="#C8D8EE" >Before you download.</text><text x="67" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#A8BDD6" >See where your GPU memory goes.</text><text x="67" y="461" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#A8BDD6" >Weights. KV cache. Runtime overhead.</text><rect x="66" y="513" width="268" height="48" rx="24" fill="#152B40" stroke="#2D4962" /><text x="84" y="544" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#D2E5F4" >Transparent formulas</text><rect x="348" y="513" width="166" height="48" rx="24" fill="#152B40" stroke="#2D4962" /><text x="366" y="544" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#D2E5F4" >No sign-up</text><rect x="528" y="513" width="180" height="48" rx="24" fill="#152B40" stroke="#2D4962" /><text x="546" y="544" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#D2E5F4" >MIT licensed</text><rect x="66" y="610" width="472" height="70" rx="15" fill="url(#accent)" /><text x="94" y="655" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#092234" >Try it free · modelvram.com</text><text x="67" y="727" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#8199B7" >TypeScript core + reproducible examples</text><rect x="840" y="92" width="690" height="650" rx="24" fill="#0A1627" stroke="#365574" /><text x="878" y="139" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#7EA2C5" letter-spacing="2">ILLUSTRATED CALCULATION</text><rect x="877" y="162" width="616" height="112" rx="14" fill="#12243A" /><text x="901" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#F3F8FF" >Llama 3.1 8B</text><text x="901" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#A4BDD8" >Q4_K_M  ·  8K context  ·  FP16 KV</text><text x="877" y="326" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#A5BDD6" >ESTIMATED MEMORY</text><text x="874" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="81" font-weight="700" fill="#68E8CC" >6.58</text><text x="1114" y="402" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="600" fill="#ACC3D9" >GiB</text><text x="878" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#A7BED6" >8 GiB memory budget</text><rect x="878" y="474" width="615" height="45" rx="8" fill="#203349" /><rect x="878" y="474" width="347.83261988625003" height="45" rx="0" fill="#56D5C3" /><rect x="1225.83261988625" y="474" width="76.875" height="45" rx="0" fill="#579BFA" /><rect x="1302.70761988625" y="474" width="80.908262019375" height="45" rx="0" fill="#B78BF9" /><rect x="879" y="543" width="15" height="15" rx="4" fill="#56D5C3" /><text x="910" y="559" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#C1D4E8" >Weights</text><text x="1464" y="559" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#E7F1FD" text-anchor="end">4.52 GiB</text><rect x="879" y="587" width="15" height="15" rx="4" fill="#579BFA" /><text x="910" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#C1D4E8" >KV cache</text><text x="1464" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#E7F1FD" text-anchor="end">1.00 GiB</text><rect x="879" y="631" width="15" height="15" rx="4" fill="#B78BF9" /><text x="910" y="647" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#C1D4E8" >Overhead</text><text x="1464" y="647" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#E7F1FD" text-anchor="end">1.05 GiB</text><text x="879" y="702" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#7D9AB7" >1 request · default overhead · rounded components</text><text x="800" y="801" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#829BB7" text-anchor="middle">Estimates, not hardware benchmarks. Inspect the formula and assumptions in the repository.</text></svg>
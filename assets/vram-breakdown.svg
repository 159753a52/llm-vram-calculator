<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">Why model file size is not the whole memory budget</title><desc id="desc">For Llama 3.1 8B Q4_K_M with FP16 KV cache and one request, increasing context from 8192 to 32768 tokens changes total estimated memory from 6.58 to 9.88 GiB. Weights remain 4.52 GiB while KV cache increases from 1 to 4 GiB.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#102137"/></linearGradient><linearGradient id="accent"><stop stop-color="#50EDC8"/><stop offset="1" stop-color="#61ABFF"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#76A3C9" stroke-opacity=".08"/></pattern></defs><rect x="0" y="0" width="1600" height="850" rx="28" fill="url(#bg)" /><rect x="0" y="0" width="1600" height="850" rx="28" fill="url(#grid)" /><text x="68" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="700" fill="#F2F7FF" >Same model. More context. More VRAM.</text><text x="70" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#9BB7D4" >Llama 3.1 8B · Q4_K_M · FP16 KV cache · one concurrent request</text><rect x="70" y="185" width="18" height="18" rx="4" fill="#56D5C3" /><text x="100" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#D7E5F4" >Weights</text><rect x="325" y="185" width="18" height="18" rx="4" fill="#579BFA" /><text x="355" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#D7E5F4" >KV cache</text><rect x="590" y="185" width="18" height="18" rx="4" fill="#B78BF9" /><text x="620" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#D7E5F4" >Runtime overhead</text><line x1="286.0" y1="253" x2="286.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="286.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">0</text><line x1="476.0" y1="253" x2="476.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="476.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">2</text><line x1="666.0" y1="253" x2="666.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="666.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">4</text><line x1="856.0" y1="253" x2="856.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="856.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">6</text><line x1="1046.0" y1="253" x2="1046.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="1046.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">8</text><line x1="1236.0" y1="253" x2="1236.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="1236.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">10</text><line x1="1426.0" y1="253" x2="1426.0" y2="550" stroke="#54728E" stroke-opacity=".28"/><text x="1426.0" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" text-anchor="middle">12</text><text x="70" y="331" font-family="DejaVu Sans, Arial, sans-serif" font-size="41" font-weight="700" fill="#F2F7FF" >8K</text><text x="70" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#8DA7C2" >context</text><rect x="286" y="300" width="429.84193677" height="74" rx="0" fill="#56D5C3" /><rect x="715.8419367700001" y="300" width="95.0" height="74" rx="0" fill="#579BFA" /><rect x="810.8419367700001" y="300" width="99.984193715" height="74" rx="0" fill="#B78BF9" /><text x="928.826130485" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#F3F8FF" >6.58 GiB</text><text x="70" y="491" font-family="DejaVu Sans, Arial, sans-serif" font-size="41" font-weight="700" fill="#F2F7FF" >32K</text><text x="70" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#8DA7C2" >context</text><rect x="286" y="460" width="429.84193677" height="74" rx="0" fill="#56D5C3" /><rect x="715.8419367700001" y="460" width="380.0" height="74" rx="0" fill="#579BFA" /><rect x="1095.84193677" y="460" width="128.484193715" height="74" rx="0" fill="#B78BF9" /><text x="1242.326130485" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#F3F8FF" >9.88 GiB</text><text x="1490" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8DA7C2" >GiB</text><rect x="69" y="631" width="1462" height="100" rx="17" fill="#132B41" stroke="#355770" /><text x="100" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#65E2CC" >Same weights</text><text x="100" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#A7BCD3" >4.52 GiB in both configurations</text><text x="612" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#79B0FF" >4× larger KV cache</text><text x="612" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#A7BCD3" >1.00 → 4.00 GiB as context grows</text><text x="1135" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#C5A1FF" >+3.30 GiB</text><text x="1135" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#A7BCD3" >total estimated memory</text><text x="72" y="778" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#829BB7" >Calculated from src/vram.ts. Overhead = 0.5 GiB + 10% of (weights + KV cache).</text><text x="72" y="811" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#829BB7" >Components rounded; totals use unrounded bytes. Actual allocation depends on the runtime. Not a benchmark.</text></svg>